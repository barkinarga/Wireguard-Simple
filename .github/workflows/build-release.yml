name: Build, test and release

on:
  push:
    branches: [readme, main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional version to publish, for example v0.1.1'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "build-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'release: v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') }}"
  # New development pushes supersede old tests; never interrupt a release run.
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: v')) }}"

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      test: ${{ steps.scope.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip heavy tests for documentation-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          test=true
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch && $COMMIT_MESSAGE != 'release: v'* ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
            if ! git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -qvE '(^|/)[^/]*\.md$|^docs/(assets|screenshots)/|^LICENSE$'; then test=false; fi
          fi
          echo "test=$test" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          node --test tests/release-version.test.mjs
          node scripts/check-release-version.mjs
      - name: Build embedded interface
        run: |
          npm ci
          npm run check
          npm run build
          npm run test:i18n
          npm run test:client-address
      - name: Backend and concurrency tests
        run: |
          go test -race ./... -count=1
          go vet ./...
      - name: Cross-compile Linux applications
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p bin
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$APP_VERSION" -o "bin/wgsimple-linux-$arch" ./cmd/wgsimple
          done
      - name: Installer tests with isolated files and mock services
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-linux.sh
          bash -n scripts/panel-output.sh
          bash -n scripts/update-check.sh
          bash -n scripts/dependencies.sh
          bash -n tests/lifecycle-linux-test.sh
          bash -n tests/download-previous-release.sh
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('tests/lifecycle-api.py').read_text())"
          bash tests/dependencies-test.sh
          bash tests/install-test.sh
          bash tests/platform-test.sh
          bash tests/update-test.sh
      - name: Package and verify installer
        run: |
          npm run package:linux
          npm run test:package
          bash release/wgsimple-install.run --help
          test "$(bin/wgsimple-linux-amd64 --version)" = '${{ steps.version.outputs.version }}'
          cp INSTALL.md LICENSE THIRD_PARTY_NOTICES.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installer
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  package-platforms:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Packages (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13-slim
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
          - name: AlmaLinux 9
            image: almalinux:9
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - name: CentOS Stream 10
            image: quay.io/centos/centos:stream10
          - name: Fedora 43
            image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and install tools in an isolated distribution container
        env:
          PLATFORM_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          node tests/build-bootstrap-fixture.mjs
          # No host networking, privileged mode, NET_ADMIN, or service startup.
          docker run --rm --cap-drop=NET_RAW \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$PLATFORM_IMAGE" bash /workspace/tests/bootstrap-platform-test.sh

  firewall-integration:
    needs: build
    name: Firewall (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UFW Ubuntu 22.04
            manager: ufw
            image: ubuntu:22.04
          - name: UFW Ubuntu 24.04
            manager: ufw
            image: ubuntu:24.04
          - name: firewalld Fedora 43
            manager: firewalld
            image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-installer
          path: release/
      - name: Extract the tested release binary without rebuilding
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mkdir -p bin
          line=$(awk '$0 == "__WGS_PAYLOAD__" { print NR + 1; exit }' release/wgsimple-install.run)
          [[ $line =~ ^[0-9]+$ ]]
          tail -n +"$line" release/wgsimple-install.run | tar -xzOf - wgsimple-amd64 > bin/wgsimple-linux-amd64
          chmod 0755 bin/wgsimple-linux-amd64
      - name: Test real firewall managers and VPN packets in disposable containers
        env:
          FIREWALL_MANAGER: ${{ matrix.manager }}
          BASE_IMAGE: ${{ matrix.image }}
        run: |
          docker build --build-arg BASE="$BASE_IMAGE" --build-arg MANAGER="$FIREWALL_MANAGER" -t wgs-firewall-test -f tests/firewall.Dockerfile tests
          # Privilege is confined to this disposable runner/container. No host
          # network, system directories or writable workspace mounts are used.
          docker run --rm --privileged --network none -e WGS_FIREWALL_TEST_CONTAINER=yes \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" wgs-firewall-test \
            bash /workspace/tests/firewall-linux-test.sh "$FIREWALL_MANAGER"

  installer-lifecycle:
    name: Install and upgrade (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-installer
          path: release/
      - name: Verify candidate and download the previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          bash tests/download-previous-release.sh
      - name: Test the exact package with real systemd, HTTPS, VPN and rollback
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools iproute2 iputils-ping nftables python3 openssl kmod
          sudo modprobe wireguard
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            bash tests/lifecycle-linux-test.sh release/wgsimple-install.run \
            .tools/previous/wgsimple-install.run "$EXPECTED_VERSION"

  publish:
    needs: [build, package-platforms, firewall-integration, installer-lifecycle]
    if: github.event_name != 'pull_request' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-installer
          path: release/
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > .release-state 2>/dev/null; then
            if [[ $(cat .release-state) == false ]]; then
              printf '%s\n' 'This version is already published; existing assets are preserved.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "WireGuard Simple $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/wgsimple-install.run release/SHA256SUMS release/INSTALL.md release/LICENSE release/THIRD_PARTY_NOTICES.md --clobber
          if [[ $RELEASE_TAG == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
